name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build static site and push gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:pages
        env:
          STATIC_EXPORT: "true"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
          DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /straphanger-NYC.io
          NEXT_PUBLIC_SITE_URL: https://astridbonoan.github.io/straphanger-NYC.io

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
